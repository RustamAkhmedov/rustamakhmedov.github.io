# Erzeugt projects.json mit authentifizierter API (5000 statt 60 Anfragen/h),
# damit Besucher die GitHub-API nicht selbst aufrufen müssen.
name: Projektliste aktualisieren

on:
  push:
    branches: [main]
    paths-ignore: [projects.json]
  schedule:
    - cron: "17 */6 * * *" # alle 6 Stunden, falls andere Repos sich ändern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projects-json
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repos abrufen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "users/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100&sort=updated" \
            --jq '[.[] | {name, description, language, stargazers_count, pushed_at, html_url, homepage, has_pages, fork, archived}]' \
            > projects.json.tmp
          # nur übernehmen, wenn gültiges, nicht-leeres JSON-Array
          jq -e 'type == "array" and length > 0' projects.json.tmp > /dev/null
          jq . projects.json.tmp > projects.json
          rm projects.json.tmp

      - name: Committen, falls geändert
        run: |
          git add projects.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Projektliste aktualisieren"
          git push
